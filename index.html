<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width:60px;
            height:150px;
            border: 2px solid black;
            display:flex;
            justify-content:space-evenly;
            flex-direction:column;
            align-items:center;
            
            background-color: black;
            


        }
        .sub{
            width:32px;
            height:32px;
            border:2px solid black;
            border-radius:100px;
            background-color: white;
        }
        #box4{
            width:100px;
            height:100px;
            background-color:black;
            display:flex;
            justify-content:space-evenly;
            align-items:center;


        }
        #box5{
            width:80px;
            height:80px;
            background-color:white;
            border-radius:50px;
        }

    </style>
</head>
<body>
    <div id="main">
        <div id="box1" class="sub"></div>
        
        <div id="box2" class="sub"></div>
        
        <div id="box3" class="sub"></div>
        
        
        


    </div>
    <br>

    <button onclick="red()"   id="button1" class="btn">RED</button>
    <button onclick="orange()" id="button2" class="btn">ORANGE</button>
    <button onclick="green()" id="button3" class="btn">GREEN</button>

    


 

<script>
  
   let box1=document.getElementById("box1");
   let box2=document.getElementById("box2");
   let box3=document.getElementById("box3");
   function turnoff(){
    box1.style.backgroundColor="white";
    box2.style.backgroundColor="white";
    box3.style.backgroundColor="white";
   }

   function red(){
         turnoff();
        box1.style.backgroundColor="red"
    }
    function orange(){
        turnoff();
        box2.style.backgroundColor="orange";

    }
   function green(){
        turnoff();
        box3.style.backgroundColor="green";
   }


   




</script>
</body>
</html>
