<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            border:2px dotted red; /*Width, Style, Color*/
            border-radius:30px;
            /*padding: 30px; Applicalble for all four sides*/
            /*padding:30px 100px 150px; Applicable for top,(rigth and left),bottom*/
            padding: 30px 10px 1px 100px;/*s Applicable for top,rigth,bottom,left*/

        }
        table{
            border:2px solid red;
            border-radius:30px;
            border-collapse:collapse;/*Default value is seperate*/
        }

    </style>
</head>
<body>
    <h1>Hello</h1>
    <table border="1">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>
</body>
</html>
