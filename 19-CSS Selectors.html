<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Simple Selector*/
        #head{
            color:red;
            background-color:burlywood;
            }

        /*Class Selector*/
        .gt{
            color:blue;
            background-color:mediumturquoise;
        }

        /*Tag selector*/
        h3{
            style:black;
            background-color:aliceblue;
        }
        u{
            style:green;
            background-color:cyan;
        }
        i{
            style:brown;
            background-color: yellowgreen;
        }

        /*Grouping selector*/
        h4,em,strong{
            color:beige;
            background-color: chocolate;
        }

        /*Grouping selector*/
        *{
            background-color:black;
            color:cadetblue;
        }
    </style>
</head>
<body>
<!--CSS Selectors-->

   <!--simple selectors-->

        <!--ID Selector-->
        <h1 id="head">ID SELECTOR</h1>

        <!--Class Selector-->
        <h2 class="gt">CLASS SELECTOR</h2>  
        <h2 class="gt">CLASS SELECTOR</h2>
        <h2 class="gt">CLASS SELECTOR</h2>

        <!--TAG SELECTOR-->
        <h3>TAG SELECTOR</h3>
        <u>TAG SELEECTOR</u>
        <i>Tag selector</i>

        <!--Grouping selector-->
        <h4>Grouping selector</h4>
        <em>Grouping selector</em>
        <strong>Grouping selector</strong>



</body>
</html>
